# Risk register seed for Aether Labs (hobby example)
# 25 realistic items for a small remote SaaS company.

risks:
  - id: R-001
    asset: "Customer workspace database (RDS)"
    threat: "Unauthorized access / data breach"
    vulnerability: "Overly broad IAM roles + missing MFA enforcement on admin paths"
    likelihood: 3
    impact: 5
    existing_controls: "AWS security groups, encryption at rest, basic CloudTrail logging"
    treatment: "Mitigate"
    owner: "Platform team"
    review_date: "2026-10-01"
    status: "Open"

  - id: R-002
    asset: "Source code repository (GitHub)"
    threat: "Malicious code injection via compromised dependency"
    vulnerability: "No dependency pinning + insufficient SCA in CI pipeline"
    likelihood: 4
    impact: 4
    existing_controls: "Branch protection, mandatory code review, basic dependabot"
    treatment: "Mitigate"
    owner: "Engineering"
    review_date: "2026-09-15"
    status: "Open"

  - id: R-003
    asset: "CI/CD pipelines (GitHub Actions)"
    threat: "Supply chain attack on runner or action"
    vulnerability: "Third-party actions pinned only by version tag, no hash"
    likelihood: 3
    impact: 5
    existing_controls: "OIDC for AWS, limited secrets scope"
    treatment: "Mitigate"
    owner: "Platform team"
    review_date: "2026-09-20"
    status: "Open"

  - id: R-004
    asset: "Production AWS account root / IAM"
    threat: "Credential compromise of privileged user"
    vulnerability: "No hardware MFA on all break-glass accounts"
    likelihood: 2
    impact: 5
    existing_controls: "IAM least privilege in most places, CloudTrail"
    treatment: "Mitigate"
    owner: "Platform team"
    review_date: "2026-10-10"
    status: "Open"

  - id: R-005
    asset: "Employee laptops / endpoints"
    threat: "Phishing leading to credential theft + initial access"
    vulnerability: "Inconsistent endpoint protection + no mandatory password manager"
    likelihood: 4
    impact: 3
    existing_controls: "M365 conditional access, basic security awareness training"
    treatment: "Mitigate"
    owner: "IT / All"
    review_date: "2026-08-30"
    status: "Open"

  - id: R-006
    asset: "Marketing website (Vercel)"
    threat: "Defacement or XSS leading to brand damage"
    vulnerability: "Limited WAF rules + no automated secret scanning on deploy"
    likelihood: 2
    impact: 2
    existing_controls: "HTTPS, basic CSP"
    treatment: "Accept"
    owner: "Marketing"
    review_date: "2026-12-01"
    status: "Accepted"

  - id: R-007
    asset: "Internal Slack workspace"
    threat: "Data exfiltration by insider or compromised account"
    vulnerability: "No DLP, public channels used for sensitive discussions"
    likelihood: 3
    impact: 3
    existing_controls: "SSO, some private channels"
    treatment: "Mitigate"
    owner: "All teams"
    review_date: "2026-09-01"
    status: "Open"

  - id: R-008
    asset: "Customer PII (emails, names in workspaces)"
    threat: "Privacy incident / GDPR violation"
    vulnerability: "No formal data retention or deletion process"
    likelihood: 3
    impact: 4
    existing_controls: "Encryption, access logging"
    treatment: "Mitigate"
    owner: "Platform + Legal (fictional)"
    review_date: "2026-10-15"
    status: "Open"

  - id: R-009
    asset: "AWS S3 buckets (customer exports, backups)"
    threat: "Public bucket misconfiguration"
    vulnerability: "No bucket policy enforcement + no automated config scanning"
    likelihood: 2
    impact: 5
    existing_controls: "Some bucket policies, manual reviews"
    treatment: "Mitigate"
    owner: "Platform team"
    review_date: "2026-09-05"
    status: "Open"

  - id: R-010
    asset: "Developer machines + local code"
    threat: "Loss or theft of unencrypted laptop with source"
    vulnerability: "Full disk encryption not enforced for all OSes"
    likelihood: 2
    impact: 3
    existing_controls: "Bitlocker/FileVault encouraged"
    treatment: "Mitigate"
    owner: "Engineering"
    review_date: "2026-11-01"
    status: "Open"

